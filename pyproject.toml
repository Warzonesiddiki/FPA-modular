[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpa-month-end-copilot"
version = "0.1.0"
description = "Offline FP&A Month-End Copilot — one analyst, the whole month-end"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pydantic>=2.9,<3",
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "reportlab>=4.2,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1", "mypy>=1.11,<2", "httpx>=0.27,<1"]
desktop = ["pywebview>=5,<6"]

[project.scripts]
fpa = "app.cli.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["perf: performance tests (slow)", "acceptance: planted-exception acceptance harness"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true

[tool.setuptools.packages.find]
include = ["app*"]
